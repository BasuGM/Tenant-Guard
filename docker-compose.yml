services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenantguard
      POSTGRES_PASSWORD: tenantguard
      POSTGRES_DB: tenantguard
    ports:
      - "5432:5432"
    volumes:
      - tenantguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantguard -d tenantguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis", "full"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq:latest
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro
    profiles: ["sqs", "full"]

  # Local S3 stand-in (MinIO images were unavailable in this environment)
  s3:
    image: adobe/s3mock:3.12.0
    environment:
      initialBuckets: tenantguard-exports
    ports:
      - "9000:9090"
    profiles: ["sqs", "full"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/local/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    profiles: ["otel"]

volumes:
  tenantguard_pg:
